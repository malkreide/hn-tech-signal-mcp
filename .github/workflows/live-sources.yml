name: Live sources

# DRIFT-005: die `live`-Tests sind das Einzige, was bemerkt, wenn HackerNews,
# arXiv, Lobste.rs oder GitHub die Form ihrer Antwort ändern. `ci.yml` wählt sie
# per `-m "not live"` ab — ohne diesen Zeitplan laufen sie nur von Hand, und ein
# Schema-Wechsel fällt erst auf, wenn jemand den Server produktiv benutzt.
on:
  schedule:
    # Täglich 05:17 UTC. Nicht zur vollen Stunde: dort staut sich die Queue.
    # Achtung: GitHub deaktiviert `schedule` nach 60 Tagen ohne Repo-Aktivität.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write # rot eröffnet oder kommentiert ein Issue, grün schliesst es

concurrency:
  group: live-sources
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Nur der Default-Branch spricht für das Repository. Ein Dispatch auf
      # einem Feature-Branch läuft und wird auch rot, rührt das Issue aber
      # nicht an: ein grüner Branch-Lauf sagt nichts über den Default-Branch,
      # und hätte am 14.8.2026 beinahe einen laufenden Ausfall zugedeckt.
      # Der Fallback greift nur, falls das Event kein `repository` mitbringt;
      # dann bleibt das Issue offen, was der harmlosere Ausgang ist.
      IS_DEFAULT_BRANCH: ${{ github.ref_name == (github.event.repository.default_branch || 'main') }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Eine Version genügt: geprüft wird die Quelle, nicht die
          # Python-Kompatibilität — dafür ist die Matrix in `ci.yml` da.
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv pip install --system -e .

      # Bewusst ohne ruff: der Pin lebt genau einmal, in `ci.yml`. Ein zweiter
      # Pin hier wäre die Abweichung, vor der CLAUDE.md warnt. Gelintet wird in
      # der CI, nicht hier.
      - name: Install test deps
        run: uv pip install --system pytest pytest-asyncio respx

      # `continue-on-error`, damit die Einordnung in jedem Fall laeuft. Rot
      # wird der Job weiter unten, aus dem eingeordneten Ergebnis.
      - name: Run live tests
        id: suite
        continue-on-error: true
        env:
          # Hebt das GitHub-Limit von 60 auf 5'000 req/h — der Server liest die
          # Variable selbst (siehe `server.py`). Das eingebaute Token reicht,
          # es muss kein Secret gesetzt werden.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          PYTHONPATH=src pytest tests/ -m live -v \
            --junitxml=live-report.xml 2>&1 | tee live-output.txt
          echo "pytest_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # `if: failure()` und `if: success()` kennen zusammen zwei Antworten. Ein
      # Live-Lauf hat drei, und die dritte zaehlt: Ein gescheitertes
      # `uv pip install`, ein Timeout oder eine umbenannte Marke sind NICHT
      # dasselbe wie eine Quelle, die ihr Schema geaendert hat.
      #
      # Der teurere Fehler stand im Schritt darunter: Ueberspringt die Suite
      # jeden Test — kein Netz, eine nicht erfuellte Vorbedingung, ein
      # erschoepftes Kontingent —, endet pytest mit 0. Das traf `success()`, und
      # der Aufraeumschritt schloss ein offenes Drift-Issue mit dem Satz «Die
      # Quellen antworten wieder wie erwartet», ohne dass eine einzige Quelle
      # gefragt worden waere.
      - name: Ergebnis einordnen
        id: verdict
        env:
          PYTEST_EXIT: ${{ steps.suite.outputs.pytest_exit }}
        run: |
          args=(live-report.xml)
          if [ -n "$PYTEST_EXIT" ]; then
            args+=(--pytest-exit "$PYTEST_EXIT")
          fi
          python scripts/classify_live_run.py "${args[@]}"

      - name: Report a red run as an issue
        # Ein roter geplanter Lauf, den niemand sieht, ist so gut wie kein Lauf.
        if: steps.verdict.outputs.state == 'finding' && env.IS_DEFAULT_BRANCH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create live-drift \
            --color B60205 \
            --description "Geplanter Lauf gegen eine externe Quelle ist rot" \
            --force
          body=$(printf '%s\n' \
            "Der geplante Live-Lauf ist rot: $RUN_URL" \
            "" \
            "Erst die Quelle abfragen, dann einordnen — nicht aus der" \
            "Fehlermeldung schliessen. Eine rote Zusicherung heisst oft nicht," \
            "dass Daten fehlen, sondern dass die Quelle ihr Schema geändert hat.")
          existing=$(gh issue list --label live-drift --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Live-Quellencheck rot" --label live-drift --body "$body"
          fi

      - name: Close the drift issue once the sources answer again
        # Sonst bleibt das Issue nach der Erholung offen stehen und der nächste
        # echte Ausfall kommentiert nur noch an ein Ticket, das niemand mehr
        # liest — ein Melder, der nie entwarnt, wird ignoriert.
        if: steps.verdict.outputs.state == 'clear' && env.IS_DEFAULT_BRANCH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Bewusst `gh api` statt `gh issue list --label`: dieser Schritt darf
          # auf einem Repo, in dem das Label noch nie angelegt wurde, nicht
          # scheitern — ein grüner Lauf würde sonst am Aufräumen rot. Der
          # Endpunkt liefert auch Pull Requests, die hier herausgefiltert
          # werden.
          open_issues=$(gh api \
            "repos/$GITHUB_REPOSITORY/issues?state=open&labels=live-drift&per_page=100" \
            --jq '.[] | select(has("pull_request") | not) | .number')
          for number in $open_issues; do
            gh issue comment "$number" --body "Die Quellen antworten wieder wie erwartet: $RUN_URL"
            gh issue close "$number" --reason completed
          done

      # Erst hier wird der Job rot. `clear` ist gruen; `finding` und `unknown`
      # sind beide rot, aber nur `finding` hat oben ein Issue erzeugt — der
      # Unterschied steht im Log, nicht im Exit-Code. `unknown` ruehrt den
      # Thread bewusst nicht an: weder oeffnen noch schliessen, weil der Lauf
      # nichts ueber die Quellen festgestellt hat.
      #
      # Ohne Branch-Bedingung: Ein Dispatch auf einem Feature-Branch soll rot
      # werden duerfen, er darf nur das Issue nicht anfassen — genau die
      # Trennung, die `IS_DEFAULT_BRANCH` oben schon zieht.
      #
      # Ueber `env`, nicht ueber `${{ }}` im Skript: Der Grund kann eine
      # Parser-Meldung ueber eine fremde Datei enthalten, und `${{ }}` setzt sie
      # vor dem Start woertlich in die Shell ein.
      - name: Ergebnis durchreichen
        if: steps.verdict.outputs.state != 'clear'
        env:
          LIVE_STATE: ${{ steps.verdict.outputs.state }}
          LIVE_REASON: ${{ steps.verdict.outputs.reason }}
        run: |
          echo "Live-Suite: $LIVE_STATE"
          echo "$LIVE_REASON"
          exit 1
