name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Ein Install statt zwei. Das `||`-Fallback stammte daher, dass es kein
      # dev-Extra gab; jetzt gibt es eins, und die Test-Abhaengigkeiten samt
      # ruff-Pin stehen dort statt hier noch einmal aufgezaehlt. Ein Fallback,
      # der still auf eine unvollstaendige Umgebung ausweicht, wuerde den
      # Fehler erst im naechsten Schritt zeigen — und dann als "ruff not
      # found" statt als "Extra fehlt".
      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      # Der Pin wirkt nur, wenn `ruff` ihn auch aufruft: liegt frueher im
      # PATH ein anderes ruff, gewinnt jenes, und der Install meldet nichts.
      - name: Ruff-Pin (PATH und Modul gegen pyproject.toml)
        run: python scripts/check_ruff_pin.py

      - name: Lint (ruff check)
        run: ruff check src tests scripts

      - name: Format check (ruff format)
        run: ruff format --check src tests scripts

      - name: Run unit tests (no network) with coverage
        # Threshold locks in the current floor (~69%). The HackerNews paths are
        # covered by respx fixtures; the remaining gap is the arXiv, Lobste.rs
        # and GitHub tool bodies, which are still only exercised by the 'live'
        # marker that CI deselects. Raise again as those gain fixtures.
        run: PYTHONPATH=src pytest tests/ -m "not live" -v --cov=hn_tech_signal_mcp --cov-report=term-missing --cov-fail-under=65

      - name: Versions-Sync (pyproject ↔ server.json / README / src)
        run: python scripts/check_version_sync.py

      # CLAUDE.md ist zweimal verrottet, ohne dass etwas rot wurde — beim
      # zweiten Mal stand dort das Gegenteil der Wahrheit. Geprueft wird nur,
      # was mechanisch belegbar ist; die Begruendung steht im Skript.
      - name: CLAUDE.md gegen das Repo (Gates, ruff-Pin, Skripte, Live-Tests)
        run: python scripts/check_claude_md.py
